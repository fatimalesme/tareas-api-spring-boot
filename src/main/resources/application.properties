spring.application.name=tareas-api

# Conexión a MySQL. Los valores tras ":" son los de por defecto (desarrollo local).
# En Docker se sobrescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tareas_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate crea/actualiza las tablas automáticamente (cómodo para un proyecto de práctica)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
